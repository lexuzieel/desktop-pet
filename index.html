<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;background:transparent;overflow:hidden;user-select:none}
  .l{position:absolute;left:0;top:0;width:340px;height:480px;pointer-events:none}
  #wrap{position:absolute;left:71px;top:70px;width:197px;height:262px;overflow:hidden;pointer-events:none;
        transform-origin:98px 262px;filter:contrast(1.05) saturate(.95) brightness(.97)}
  video{position:absolute;left:-48px;top:0;width:245px;height:285px}
  #drag{position:absolute;inset:0;cursor:grab}
</style>
<svg class="l" viewBox="0 0 340 480">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#1b2227" stop-opacity=".97"/><stop offset="1" stop-color="#05080a" stop-opacity=".98"/></radialGradient>
  </defs>
  <ellipse cx="170" cy="468" rx="165" ry="9" fill="#000" fill-opacity=".35"/>
  <path d="M30 44 V402 A140 13 0 0 0 310 402 V44 A140 16 0 0 0 30 44Z" fill="url(#bg)"/>
</svg>
<div id="wrap">
  <video id="idle" src="assets/idle.webm" muted loop autoplay playsinline></video>
  <video id="react" src="assets/react.webm" muted playsinline style="visibility:hidden"></video>
</div>
<canvas id="fx" class="l"></canvas>
<canvas id="gl" class="l"></canvas>
<div id="drag"></div>
<script>
const idle=document.getElementById('idle'), react=document.getElementById('react'), wrap=document.getElementById('wrap');
let reacting=false, timer;
function schedule(){ clearTimeout(timer); timer=setTimeout(playReact, 8000+Math.random()*15000); }
function playReact(){
  if(reacting) return; reacting=true;
  react.currentTime=0; react.play();
  react.style.visibility='visible'; idle.style.visibility='hidden';
}
react.addEventListener('ended',()=>{
  reacting=false; idle.currentTime=0; idle.play();
  idle.style.visibility='visible'; react.style.visibility='hidden'; schedule();
});

// ---------- drag (also feeds the physics with window position) ----------
const d=document.getElementById('drag'); let start=null, moved=false;
let winPos=null; // latest window position while dragging
d.addEventListener('mousedown',async e=>{
  if(e.button!==0) return;
  const p=await window.pet.pos(); start={c:p.cursor,w:p.win}; moved=false; d.style.cursor='grabbing';
  winPos={x:p.win[0],y:p.win[1]};
});
window.addEventListener('mousemove',async e=>{
  if(!start||!(e.buttons&1)) return;
  const p=await window.pet.pos(); const dx=p.cursor.x-start.c.x, dy=p.cursor.y-start.c.y;
  if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  winPos={x:start.w[0]+dx,y:start.w[1]+dy};
  window.pet.move(winPos.x,winPos.y);
});
window.addEventListener('mouseup',()=>{ if(start&&!moved) playReact(); start=null; d.style.cursor='grab'; });
d.addEventListener('contextmenu',e=>{e.preventDefault(); window.pet.quit();});
schedule();

</script>
<script src="fluid.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module" src="scene.js"></script>
