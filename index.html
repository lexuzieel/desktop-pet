<div id="drag"></div>
<script>
const idle=document.getElementById('idle'), react=document.getElementById('react'), wrap=document.getElementById('wrap');
let reacting=false, timer;
function schedule(){ clearTimeout(timer); timer=setTimeout(playReact, 8000+Math.random()*15000); }
function playReact(){
  if(reacting) return; reacting=true;
  react.currentTime=0; react.play();
  react.style.visibility='visible'; idle.style.visibility='hidden';
}
react.addEventListener('ended',()=>{
  reacting=false; idle.currentTime=0; idle.play();
  idle.style.visibility='visible'; react.style.visibility='hidden'; schedule();
});

// ---------- drag (also feeds the physics with window position) ----------
const d=document.getElementById('drag'); let start=null, moved=false;
let winPos=null; // latest window position while dragging
d.addEventListener('mousedown',async e=>{
  if(e.button!==0) return;
  const p=await window.pet.pos(); start={c:p.cursor,w:p.win}; moved=false; d.style.cursor='grabbing';
  winPos={x:p.win[0],y:p.win[1]};
});
window.addEventListener('mousemove',async e=>{
  if(!start||!(e.buttons&1)) return;
  const p=await window.pet.pos(); const dx=p.cursor.x-start.c.x, dy=p.cursor.y-start.c.y;
  if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  winPos={x:start.w[0]+dx,y:start.w[1]+dy};
  window.pet.move(winPos.x,winPos.y);
});
window.addEventListener('mouseup',()=>{ if(start&&!moved) playReact(); start=null; d.style.cursor='grab'; });
d.addEventListener('contextmenu',e=>{e.preventDefault(); window.pet.quit();});
schedule();

// ---------- fluid + bubbles + head physics ----------
const cv=document.getElementById('fx'), ctx=cv.getContext('2d');
const dpr=window.devicePixelRatio||1; cv.width=340*dpr; cv.height=480*dpr; ctx.scale(dpr,dpr);
const L=30, R=310, BOT=402, Y0=64, N=48, DX=(R-L)/(N-1);
const h=new Float32Array(N), hv=new Float32Array(N);
let wx=0, wy=0;                       // bulk water velocity relative to jar
let phi=0, phiV=0, sx=0, sxV=0, sy=0, syV=0; // head: tilt, sway, bob
let prevPos=null, prevVel={x:0,y:0}, ax=0, ay=0, lastT=performance.now();
const bubbles=[];
function spawn(x,y,r){ bubbles.push({x,y,r,vx:0,vy:0,ph:Math.random()*6.28,pop:0}); }
function surfaceAt(x){ const f=(x-L)/DX, i=Math.max(0,Math.min(N-2,Math.floor(f))), t=f-i; return Y0-(h[i]*(1-t)+h[i+1]*t); }
function step(dt){
  // jar acceleration from dragged window position
  if(winPos){
    if(prevPos){
      const vx=(winPos.x-prevPos.x)/dt, vy=(winPos.y-prevPos.y)/dt;
      const rax=(vx-prevVel.x)/dt, ray=(vy-prevVel.y)/dt;
      ax+=(rax-ax)*0.5; ay+=(ray-ay)*0.5; prevVel={x:vx,y:vy};
    }
    prevPos={x:winPos.x,y:winPos.y};
    if(!start) winPos=null;
  } else if(prevPos){
    // released: window stops dead -> big deceleration pulse, then rest
    const rax=(0-prevVel.x)/dt, ray=(0-prevVel.y)/dt;
    ax=rax; ay=ray; prevVel={x:0,y:0}; prevPos=null;
  } else { ax*=0.5; ay*=0.5; }
  const nax=Math.max(-4,Math.min(4,ax/2500)), nay=Math.max(-4,Math.min(4,ay/2500));
  const energy=Math.hypot(nax,nay);

  // wave field
  for(let i=0;i<N;i++){
    const l=h[i>0?i-1:1], r=h[i<N-1?i+1:N-2];
    let acc=(l+r-2*h[i])*0.35 - h[i]*0.012;
    acc+= -nax*3.2*((i-(N-1)/2)/((N-1)/2)) + nay*2.4;
    hv[i]=(hv[i]+acc)*0.985;
  }
  for(let i=0;i<N;i++){ h[i]+=hv[i]; if(h[i]>18)h[i]=18; if(h[i]<-14)h[i]=-14; }

  // bulk water current
  wx=(wx - nax*1.6)*0.975; wy=(wy + nay*1.2)*0.975;

  // head on its neck: damped springs driven by the water current
  phiV+=(-phi*0.045 - phiV*0.06) + (-nax*0.55 + wx*0.04);
  phi+=phiV;
  sxV+=(-sx*0.05 - sxV*0.08) + (-nax*0.35);
  sx+=sxV;
  syV+=(-sy*0.06 - syV*0.09) + (nay*0.35);
  sy+=syV;
  phi=Math.max(-7,Math.min(7,phi)); sx=Math.max(-6,Math.min(6,sx)); sy=Math.max(-5,Math.min(5,sy));
  wrap.style.transform=`translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) rotate(${phi.toFixed(2)}deg)`;

  // bubbles: gentle stream + bursts when shaken
  if(Math.random()<0.03) spawn(L+20+Math.random()*(R-L-40), BOT-4, 1.2+Math.random()*2.2);
  const burst=Math.min(10,energy*4);
  for(let k=0;k<burst;k++) if(Math.random()<0.7)
    spawn(L+10+Math.random()*(R-L-20), Y0+30+Math.random()*(BOT-Y0-50), 1+Math.random()*4.5);
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];
    if(b.pop){ b.pop++; if(b.pop>8) bubbles.splice(i,1); continue; }
    const rise=0.012+b.r*0.012;
    b.vx+=(wx*0.5-b.vx)*0.05 + nax*0.08 + Math.sin(b.ph+=0.08)*0.015 + (Math.random()-0.5)*energy*0.1;
    b.vy+=(wy*0.5-b.vy)*0.05 - rise + (Math.random()-0.5)*energy*0.1;
    b.x+=b.vx; b.y+=b.vy;
    if(b.x<L+b.r){b.x=L+b.r;b.vx*=-0.4;} if(b.x>R-b.r){b.x=R-b.r;b.vx*=-0.4;}
    if(b.y>BOT-b.r){b.y=BOT-b.r;b.vy=-Math.abs(b.vy)*0.3;}
    if(b.y<surfaceAt(b.x)+b.r*0.5) b.pop=1;
  }
  if(bubbles.length>260) bubbles.splice(0,bubbles.length-260);
}
function draw(){
  ctx.clearRect(0,0,340,480);
  ctx.save();
  ctx.beginPath(); ctx.moveTo(L,44); ctx.lineTo(L,BOT); ctx.ellipse(170,BOT,140,13,0,Math.PI,0,true); ctx.lineTo(R,44); ctx.closePath(); ctx.clip();
  // water body
  ctx.beginPath(); ctx.moveTo(L,BOT+15);
  for(let i=0;i<N;i++) ctx.lineTo(L+i*DX, Y0-h[i]);
  ctx.lineTo(R,BOT+15); ctx.closePath();
  const g=ctx.createLinearGradient(0,Y0,0,BOT);
  g.addColorStop(0,'rgba(150,215,205,0.20)'); g.addColorStop(1,'rgba(40,95,100,0.34)');
  ctx.fillStyle=g; ctx.fill();
  // bubbles
  for(const b of bubbles){
    if(b.pop){ ctx.strokeStyle=`rgba(255,255,255,${0.5-b.pop*0.06})`; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+b.pop*1.2,0,6.283); ctx.stroke(); continue; }
    const rg=ctx.createRadialGradient(b.x-b.r*.3,b.y-b.r*.3,b.r*.1,b.x,b.y,b.r);
    rg.addColorStop(0,'rgba(255,255,255,0.35)'); rg.addColorStop(.7,'rgba(200,235,240,0.08)'); rg.addColorStop(1,'rgba(255,255,255,0.45)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=0.8; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(b.x-b.r*.35,b.y-b.r*.35,Math.max(.6,b.r*.22),0,6.283); ctx.fill();
  }
  // surface: lit band + highlight line
  ctx.beginPath(); for(let i=0;i<N;i++){const x=L+i*DX,y=Y0-h[i]; i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N-1;i>=0;i--) ctx.lineTo(L+i*DX, Y0-h[i]+9+ (h[i]-(h[i>0?i-1:0]))*2);
  ctx.closePath(); ctx.fillStyle='rgba(220,250,245,0.14)'; ctx.fill();
  ctx.beginPath(); for(let i=0;i<N;i++){const x=L+i*DX,y=Y0-h[i]; i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.6; ctx.stroke();
  ctx.restore();
}
function loop(now){
  const dt=Math.max(0.004,Math.min(0.05,(now-lastT)/1000)); lastT=now;
  step(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
